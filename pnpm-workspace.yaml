packages:
  - app
  - server
  # The MCP server (add-agent-access): a client of the API, no database access of its own.
  - server/mcp
  - shared

overrides:
  # lemmascript's optional `lsc claimcheck` (an LLM round-trip) is not used; it would add the
  # Anthropic, Bedrock and Vertex SDKs to the lockfile. lsc loads it only for that command.
  lemmascript>lemmascript-claimcheck: '-'
