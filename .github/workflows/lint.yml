# Lint and formatting on every push and pull request: ESLint with type information (server,
# shared, app), ShellCheck for the shell scripts, and Prettier. Existing ESLint findings are
# recorded in eslint-suppressions.json and files not yet formatted in .prettierignore; anything
# new fails. Run the same locally with `pnpm lint` and `pnpm format:check`.
name: lint

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm run lint:js
      - name: ShellCheck
        run: pnpm run lint:sh
      - name: Prettier
        run: pnpm run format:check
