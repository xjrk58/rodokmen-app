# The code checks on every push and pull request, and before every deploy (deploy.yml): gitleaks
# over the new commits, then `pnpm check` (scripts/check.mjs): types, ESLint, ShellCheck,
# Prettier, knip, dependency-cruiser, jscpd, pnpm audit, the OpenAPI check and the proofs' trace
# check. Run the same locally with `pnpm check` and `pnpm gitleaks`; AGENTS.md ("Tools before
# agents") says how to fix what each reports. Known findings are recorded where the tool can only
# shrink them: eslint-suppressions.json and .dependency-cruiser-known-violations.json.
name: lint

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks reads the commits this push or pull request brings.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: gitleaks (secrets in the pushed commits)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request's own commits; a push's new commits; else (a new branch, a force push)
          # the commits not on main yet.
          if [ -n "$BASE" ]; then
            range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="origin/main..HEAD"
          fi
          echo "Scanning $range"
          node scripts/gitleaks.mjs "$range"
      - name: pnpm check
        # Also after gitleaks fails, so one run shows everything to fix.
        if: ${{ !cancelled() }}
        run: pnpm check
