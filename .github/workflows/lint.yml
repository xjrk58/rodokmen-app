# Lint and formatting on every push and pull request: ESLint with type information (server,
# shared, app), ShellCheck for the shell scripts, and Prettier. Existing ESLint findings are
# recorded in eslint-suppressions.json and files not yet formatted in .prettierignore; anything
# new fails. Run the same locally with `pnpm lint` and `pnpm format:check`.
name: lint

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks reads the commits this push or pull request brings.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm run lint:js
      - name: ShellCheck
        run: pnpm run lint:sh
      - name: Prettier
        run: pnpm run format:check
      - name: gitleaks (secrets in the pushed commits)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request's own commits; a push's new commits; else (a new branch, a force push)
          # the commits not on main yet.
          if [ -n "$BASE" ]; then
            range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="origin/main..HEAD"
          fi
          echo "Scanning $range"
          node scripts/gitleaks.mjs "$range"
