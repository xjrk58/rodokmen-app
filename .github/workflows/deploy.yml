name: deploy

# A merge to main deploys automatically once the server and app tests, the proofs (verify.yml, ADR 0009)
# and the repo guard pass (operations spec, "Deploys from CI"). The image goes to GHCR; the VPS starts it in the idle API slot and
# switches only when its health check passes (deploy/scripts/deploy.sh). A failed health check
# leaves the previous version serving and alerts the Owner.
#
# Secrets (Settings → Secrets and variables → Actions, environment "production"):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
# Variable: DEPLOY_PATH (default /opt/rodokmen). See deploy/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: Start the previously deployed image again instead of building
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    if: ${{ !inputs.rollback }}
    uses: ./.github/workflows/server-ci.yml

  guard:
    if: ${{ !inputs.rollback }}
    uses: ./.github/workflows/repo-guard.yml

  app:
    if: ${{ !inputs.rollback }}
    uses: ./.github/workflows/app-ci.yml

  proofs:
    if: ${{ !inputs.rollback }}
    uses: ./.github/workflows/verify.yml

  image:
    if: ${{ !inputs.rollback }}
    needs: [tests, guard, app, proofs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "main=ghcr.io/${GITHUB_REPOSITORY,,}:main" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: RELEASE=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.main }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [image]
    if: ${{ always() && (inputs.rollback || needs.image.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rodokmen' }}
      TARGET: ${{ inputs.rollback && 'rollback' || needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config
      - name: Copy the stack definition (compose, Caddyfile, scripts; never .env)
        run: |
          rsync -rlptz --delete \
            --exclude '.env' --exclude 'backup.env' --exclude 'state/' --exclude '.gitignore' \
            deploy/ "vps:$DEPLOY_PATH/"
      - name: Log the VPS in to GHCR for this pull
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh vps docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Health-checked switch
        run: |
          # shellcheck disable=SC2029 # expanded here on purpose
          ssh vps "cd '$DEPLOY_PATH' && ./scripts/deploy.sh '$TARGET'"
      - name: Public health check
        run: |
          # shellcheck disable=SC2029 # expanded here on purpose
          domain=$(ssh vps "grep -E '^DOMAIN=' '$DEPLOY_PATH/.env' | cut -d= -f2-")
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "https://$domain/api/health"
