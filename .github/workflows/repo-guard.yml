name: repo-guard

# This repo is public: fail if it gains family data (GEDCOM files, a people/ folder,
# or images outside app/ and test fixtures). See .github/scripts/repo-guard.sh.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/repo-guard.sh
      # The Vault-name guard itself (scripts/vault-guard.mjs); its denylist is private, so CI only tests it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test 'scripts/test/*.test.mjs'
