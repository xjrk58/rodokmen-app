name: backup-restore-test

# Monthly restore test (operations spec): restores the latest Backup from the second provider
# into a throwaway PostGIS container, checks that the record counts and the number of image files
# match production at Backup time and that every image of the Tree has its files, and emails the
# Owner if not (deploy/backup/restore-check.sh). Then it erases again every Person on the newest
# list of erasures that the restore still holds, with the server's `erasures reapply`, and fails
# if one remains (erasure spec, "Restores keep erased people erased").
#
# To see it fail on purpose, run it by hand with "empty_table" set (for example "person"), or
# with "remove_image" ticked (one restored image file is deleted before comparing). To restore a
# Backup taken before an erasure (scenario "Restore from an old Backup"), give its snapshot id.
#
# Secrets (environment "backups"): RESTIC_REPOSITORY, RESTIC_PASSWORD, BACKUP_S3_ACCESS_KEY_ID,
# BACKUP_S3_SECRET_ACCESS_KEY, and for the alert: SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER,
# SMTP_PASSWORD, MAIL_FROM, ALERT_EMAIL. See deploy/README.md.
on:
  schedule:
    - cron: '17 4 3 * *'
  workflow_dispatch:
    inputs:
      empty_table:
        description: Deliberately empty this table in the scratch restore (the test must then fail)
        required: false
        default: ''
      remove_image:
        description: Deliberately delete one restored image file (the test must then fail)
        type: boolean
        default: false
      snapshot:
        description: The snapshot to restore (an id from restic snapshots), for example one taken before an erasure
        required: false
        default: latest

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: backups
    services:
      scratch:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      PGHOST: localhost
      PGUSER: restore
      PGPASSWORD: restore
      SCRATCH_DB: rodokmen_restore
      EMPTY_TABLE: ${{ inputs.empty_table }}
      REMOVE_IMAGE: ${{ inputs.remove_image && '1' || '' }}
      SNAPSHOT: ${{ inputs.snapshot || 'latest' }}
      RESTORE_DIR: ${{ runner.temp }}/restore
      KEEP_SCRATCH: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install restic and the PostgreSQL 16 client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q restic postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Restore the Backup and compare record and image counts
        run: mkdir -p "$RESTORE_DIR" && deploy/backup/restore-check.sh
      - run: pnpm install --frozen-lockfile --filter @rodokmen/server...
      - name: Erase again the Persons on the newest list of erasures, and check none remains
        env:
          DATABASE_URL: postgres://restore:restore@localhost:5432/rodokmen_restore
        run: |
          pnpm --filter @rodokmen/server cli erasures reapply --list "$RESTORE_DIR/erasures.tsv"
          remaining=$(psql -qAtX -v ON_ERROR_STOP=1 -d rodokmen_restore -c "select count(*) from person where id in (select person_id from erasure)")
          echo "erased Persons left in the restore: $remaining"
          test "$remaining" = 0
      - name: Drop the scratch database
        if: always()
        run: dropdb --if-exists rodokmen_restore
      - name: Alert the Owner
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          deploy/backup/send-alert.sh "Monthly restore test failed" \
            "The restore test of the latest Backup failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}${EMPTY_TABLE:+ (table $EMPTY_TABLE was emptied on purpose)}${REMOVE_IMAGE:+ (an image file was deleted on purpose)}"
