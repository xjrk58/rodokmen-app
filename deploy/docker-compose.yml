# Rodokmen on one VPS (design.md, "Hosting"): PostgreSQL with PostGIS, the API (which also
# serves app/), Garage for page images, and Caddy for HTTPS. Two API slots, api-blue and
# api-green, let a deploy start the new version next to the old one and switch only when it is
# healthy (scripts/deploy.sh).
#
# Memory: every service has a limit, and together they fit the 4 GB VPS with both API slots and
# the nightly Backup running at once (README.md, "Memory").
#
# Configuration: .env (API, watchdog) and backup.env (Backup job) next to this file; see the
# *.example files and README.md. Image tags of the two API slots and the watchdog come from
# state/images.env, written by scripts/deploy.sh.
#
# Locally:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build db garage api-blue caddy
#           then deploy/scripts/storage-init.sh once for the Backup's key (README.md, "Local development")

name: rodokmen

# Page images in Garage (service garage), for the API and the watchdog (which checks the same
# configuration). The API reaches Garage on this network and signs links for the files host,
# which Caddy passes to Garage unchanged (README.md, "Image links"). The key is in .env.
x-image-store: &image-store
  S3_ENDPOINT: http://garage:3900
  S3_PUBLIC_ENDPOINT: https://files.${DOMAIN:?set DOMAIN in .env}
  S3_REGION: garage
  S3_BUCKET: rodokmen-images
  S3_FORCE_PATH_STYLE: 'true'

x-api: &api
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  env_file:
    - path: .env
      required: true
  environment:
    <<: *image-store
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '3000'
    APP_DIR: /srv/app
    TRUST_PROXY: 'true'
    PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
    DATABASE_URL: postgres://rodokmen:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/rodokmen
    # glibc gives each thread its own heap and returns little of it. With two, the memory one
    # large image needed is reused for the next (measured: 15 to 20 % lower peaks with several).
    MALLOC_ARENA_MAX: '2'
  depends_on:
    db:
      condition: service_healthy
    garage:
      condition: service_healthy
  healthcheck:
    test: ['CMD', 'node', 'dist/cli.js', 'health']
    interval: 10s
    timeout: 6s
    retries: 3
    start_period: 40s
  # Each slot: Node (its heap stops at half the limit) and the display copies, made one upload at
  # a time by sharp outside that heap. During a deploy both slots run.
  mem_limit: 512m
  memswap_limit: 768m
  mem_reservation: 128m
  stop_grace_period: 20s
  networks:
    rodokmen:
      aliases: [api]

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    # Sized for the 4 GB VPS (README.md, "Memory"). PostgreSQL reads these when it starts: Compose
    # recreates the container when they change (deploy.sh runs `up -d db`).
    command:
      - postgres
      # Its own cache of table and index pages: a quarter of the RAM, the usual share. The Tree is
      # far smaller (206 invented Persons take about 11 MB), so this rarely fills.
      - --shared_buffers=1GB
      # Only a hint to the planner: what shared_buffers and the kernel's file cache together may
      # hold. mem_limit below also caps that file cache, so 1.5 GB rather than half the RAM.
      - --effective_cache_size=1536MB
      # Per sort or hash step of a query before it spills to disk; the Tree's queries sort
      # hundreds of rows, so they seldom use more than a fraction of it.
      - --work_mem=8MB
      # VACUUM, CREATE INDEX in migrations, and each autovacuum worker (which takes only what its
      # table needs).
      - --maintenance_work_mem=128MB
      # Two API slots with a pool of 10 each (server/src/db/db.ts) during a deploy, a CLI command's
      # pool (create-owner, migrate), the Backup's 2 (pg_dump and its snapshot), psql by hand, and
      # the 3 reserved for superusers. The MCP server and the watchdog never connect.
      - --max_connections=40
    environment:
      POSTGRES_DB: rodokmen
      POSTGRES_USER: rodokmen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rodokmen -d rodokmen']
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
    # shared_buffers, about 20 connections and their work_mem; the reservation keeps the cache in
    # RAM when the server is short of memory.
    mem_limit: 1536m
    memswap_limit: 2g
    mem_reservation: 1g
    networks: [rodokmen]

  # Page images (originals, display copies, pending uploads): Garage, a small S3-compatible
  # server, on the volume images. Private: no published ports, and Caddy forwards only presigned
  # requests for the bucket's objects. On first start it lays out its one node and creates the
  # bucket and the API's key from .env; scripts/storage-init.sh adds the Backup's read-only key.
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_DEFAULT_BUCKET: rodokmen-images
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      # Startup and errors, without a line for every health check.
      RUST_LOG: garage=info,garage_net=warn,garage_api_admin=warn
      # The folder, not the file: a deploy replaces the file, and only a mounted folder shows the
      # new one. Garage reads it when it starts; deploy.sh restarts it when the file changed.
      GARAGE_CONFIG_FILE: /etc/garage/garage.toml
    volumes:
      - ./garage:/etc/garage:ro
      - images:/var/lib/garage
    healthcheck:
      test: ['CMD', '/garage', 'health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s
    # Measured locally: about 10 MB in use, at most 39 MB (page cache included) while a 19 MB
    # image went in and during a Backup. 128 MB leaves room for several uploads at once.
    mem_limit: 128m
    memswap_limit: 192m
    stop_grace_period: 20s
    networks: [rodokmen]

  api-blue:
    <<: *api
    image: ${API_IMAGE_BLUE:-ghcr.io/xjrk58/rodokmen-app:main}

  api-green:
    <<: *api
    image: ${API_IMAGE_GREEN:-ghcr.io/xjrk58/rodokmen-app:main}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      # The folder, not the file: a deploy replaces the Caddyfile, and only a mounted folder shows
      # the new one to Caddy (deploy.sh reloads it).
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    # Uploads stream through to Garage; nothing is buffered here.
    mem_limit: 128m
    memswap_limit: 192m
    networks: [rodokmen]

  # The MCP server (add-agent-access) at https://$DOMAIN/mcp, behind Caddy. A client of the API
  # with each caller's Agent token: no .env, so no database password or other secret. Follows
  # each release (scripts/deploy.sh).
  mcp:
    image: ${MCP_IMAGE:-ghcr.io/xjrk58/rodokmen-app:main}
    restart: unless-stopped
    command: ['node', '/srv/mcp/dist/http-main.js']
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      RODOKMEN_API_URL: http://api:3000
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/mcp/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    memswap_limit: 192m
    networks: [rodokmen]

  # Alerts the Owner when the public health check fails for over 5 minutes or a Backup fails.
  watchdog:
    image: ${WATCHDOG_IMAGE:-ghcr.io/xjrk58/rodokmen-app:main}
    restart: unless-stopped
    command: ['node', 'dist/cli.js', 'watchdog']
    env_file:
      - path: .env
        required: true
    environment:
      <<: *image-store
      NODE_ENV: production
      PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      WATCHDOG_URL: https://${DOMAIN:?set DOMAIN in .env}/api/health
      BACKUP_STATUS_FILE: /status/backup.json
    volumes:
      - backup_status:/status:ro
    healthcheck:
      disable: true
    mem_limit: 128m
    memswap_limit: 192m
    networks: [rodokmen]

  # Nightly Backup, started by systemd (systemd/rodokmen-backup.timer):
  #   docker compose --profile jobs run --rm backup
  backup:
    build: ./backup
    image: rodokmen-backup:local
    profiles: [jobs]
    env_file:
      - path: backup.env
        required: true
    environment:
      PGHOST: db
      PGUSER: rodokmen
      PGDATABASE: rodokmen
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      WORK_DIR: /work
      STATUS_FILE: /status/backup.json
      # Every image, copied out of Garage with the Backup's read-only key (scripts/storage-init.sh).
      # The rclone remote "images" is defined here rather than in IMAGES_SOURCE, because rclone
      # repeats the source in its error messages, and those go into the alert email.
      IMAGES_SOURCE: images:rodokmen-images
      RCLONE_CONFIG_IMAGES_TYPE: s3
      RCLONE_CONFIG_IMAGES_PROVIDER: Other
      RCLONE_CONFIG_IMAGES_ENDPOINT: http://garage:3900
      RCLONE_CONFIG_IMAGES_REGION: garage
      RCLONE_CONFIG_IMAGES_FORCE_PATH_STYLE: 'true'
      RCLONE_CONFIG_IMAGES_ACCESS_KEY_ID: ${IMAGES_BACKUP_KEY_ID:?set IMAGES_BACKUP_KEY_ID in .env}
      RCLONE_CONFIG_IMAGES_SECRET_ACCESS_KEY: ${IMAGES_BACKUP_SECRET_KEY:?set IMAGES_BACKUP_SECRET_KEY in .env}
    volumes:
      - backup_status:/status
      - backup_work:/work
    # pg_dump, then rclone, then restic, one after the other; restic's index grows with the
    # repository. Files it writes count here too, but the kernel drops them from memory first.
    mem_limit: 512m
    memswap_limit: 768m
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    networks: [rodokmen]

volumes:
  pgdata:
  images:
  caddy_data:
  caddy_config:
  backup_status:
  backup_work:

networks:
  rodokmen:
