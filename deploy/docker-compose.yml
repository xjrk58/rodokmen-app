# Rodokmen on one VPS (design.md, "Hosting"): PostgreSQL with PostGIS, the API (which also
# serves app/), and Caddy for HTTPS. Two API slots, api-blue and api-green, let a deploy start
# the new version next to the old one and switch only when it is healthy (scripts/deploy.sh).
#
# Configuration: .env (API, watchdog) and backup.env (Backup job) next to this file; see the
# *.example files and README.md. Image tags of the two API slots and the watchdog come from
# state/images.env, written by scripts/deploy.sh.
#
# Locally:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build db api-blue caddy

name: rodokmen

x-api: &api
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  env_file:
    - path: .env
      required: true
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '3000'
    APP_DIR: /srv/app
    TRUST_PROXY: 'true'
    PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
    DATABASE_URL: postgres://rodokmen:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/rodokmen
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ['CMD', 'node', 'dist/cli.js', 'health']
    interval: 10s
    timeout: 6s
    retries: 3
    start_period: 40s
  stop_grace_period: 20s
  networks:
    rodokmen:
      aliases: [api]

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: rodokmen
      POSTGRES_USER: rodokmen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rodokmen -d rodokmen']
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
    networks: [rodokmen]

  api-blue:
    <<: *api
    image: ${API_IMAGE_BLUE:-ghcr.io/xjrk58/rodokmen-app:main}

  api-green:
    <<: *api
    image: ${API_IMAGE_GREEN:-ghcr.io/xjrk58/rodokmen-app:main}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [rodokmen]

  # Alerts the Owner when the public health check fails for over 5 minutes or a Backup fails.
  watchdog:
    image: ${WATCHDOG_IMAGE:-ghcr.io/xjrk58/rodokmen-app:main}
    restart: unless-stopped
    command: ['node', 'dist/cli.js', 'watchdog']
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      WATCHDOG_URL: https://${DOMAIN:?set DOMAIN in .env}/api/health
      BACKUP_STATUS_FILE: /status/backup.json
    volumes:
      - backup_status:/status:ro
    healthcheck:
      disable: true
    networks: [rodokmen]

  # Nightly Backup, started by systemd (systemd/rodokmen-backup.timer):
  #   docker compose --profile jobs run --rm backup
  backup:
    build: ./backup
    image: rodokmen-backup:local
    profiles: [jobs]
    env_file:
      - path: backup.env
        required: true
    environment:
      PGHOST: db
      PGUSER: rodokmen
      PGDATABASE: rodokmen
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      WORK_DIR: /work
      STATUS_FILE: /status/backup.json
    volumes:
      - backup_status:/status
      - backup_work:/work
    depends_on:
      db:
        condition: service_healthy
    networks: [rodokmen]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backup_status:
  backup_work:

networks:
  rodokmen:
