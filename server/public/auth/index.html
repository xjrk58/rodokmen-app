<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Rodokmen</title>
  <link rel="stylesheet" href="/auth/auth.css">
  <script type="module" src="/auth/auth.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Rodokmen</h1>
      <button type="button" id="lang-switch" class="link"></button>
    </header>

    <p id="status" role="status" aria-live="polite"></p>

    <form id="invite-form" hidden>
      <label for="name" data-t="name"></label>
      <input id="name" name="name" autocomplete="name" required maxlength="100">
      <label for="language" data-t="language"></label>
      <select id="language" name="language">
        <option value="cs">Čeština</option>
        <option value="en">English</option>
      </select>
      <button type="submit" id="accept" data-t="accept"></button>
    </form>

    <section id="link-step" hidden>
      <button type="button" id="link-sign-in" data-t="signInWithLink"></button>
    </section>

    <section id="passkey-step" hidden>
      <p data-t="passkeyWhy"></p>
      <button type="button" id="register-passkey" data-t="savePasskey"></button>
      <button type="button" id="skip-passkey" class="link" data-t="later"></button>
    </section>

    <section id="sign-in-step" hidden>
      <button type="button" id="passkey-sign-in" data-t="signInWithPasskey"></button>
      <form id="email-form">
        <label for="email" data-t="noPasskey"></label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <button type="submit" id="send-link" data-t="sendLink"></button>
      </form>
    </section>

    <section id="done" hidden>
      <a href="/" id="open-app" data-t="openApp"></a>
    </section>
  </main>
</body>
</html>
