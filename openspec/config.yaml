schema: spec-driven

context: |
  Rodokmen is a private shared family tree for one extended family, shown on a map of the Czech lands (19th century and earlier).
  Use the terms in GLOSSARY.md exactly (Member, Editor, Agent, Proposal, Draft, Tree, Source, Citation, Place, Municipality, Czech lands).
  Recorded decisions live in docs/adr/; artifacts must not contradict them without saying so.
  This repo (rodokmen-app) is public: never put family data, real people's names or real research notes in it; examples use invented people.
  The map app is mobile-first and must work on Android Chrome; its UI ships in Czech and English.
  The Tree backend is built from scratch (ADR 0004): TypeScript on Node, one PostgreSQL + PostGIS database (ADR 0005), current state plus a log of accepted Proposals (ADR 0006).
  One public monorepo with app/, server/ and shared/; the PWA is the only interface; app and API share one domain on an EU VPS (ADR 0007).
  The nightly one-way Export goes to the private rodokmen-export repo and is never edited by hand (ADR 0008, 0010).
  Scan reading sends scans to the Anthropic API only when the Owner switches it on (ADR 0011).
  For signed-in Members the app's home screen is the tree around a Focus Person; the map is a tab, and the home screen for visitors who aren't signed in.
  The private rodokmen-data repo is the Owner's earlier Vault: imported once (add-vault-import), then a read-only archive (ADR 0010).
  The docs follow Diátaxis (docs/README.md is the index); every change updates them in the right section (AGENTS.md, "Docs").
  Pure rules are proved with LemmaScript and traced to their requirement with `//@ contract <capability>: <Requirement>` (ADR 0009, docs/verification.md).

rules:
  proposal:
    - State what is out of scope.
  design:
    - "Under \"Rules proved with LemmaScript\", name each pure rule of the change (a decision with no I/O, clock, `await` or regex), the requirement it serves and the file it will live in, or say that none qualifies (ADR 0009)."
  tasks:
    - Every task names how it is verified.
    - "For each rule under \"Rules proved with LemmaScript\" in design.md, include a task to prove it with `lsc check`, its ensures stating the requirement's scenarios and a `//@ contract <capability>: <Requirement>` line per requirement; verify with `pnpm verify` and `pnpm verify:trace`, and by a deliberate bug that makes `lsc check` fail."
    - "Include a docs task (AGENTS.md, \"Docs\"): name the Diátaxis section (tutorials, how-to, reference or explanation) and each page under docs/ it adds or changes, the docs/README.md index line for a new page, and README.md when what works changes; verify with `pnpm lint:docs`."
