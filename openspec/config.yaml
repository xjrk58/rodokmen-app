schema: spec-driven

context: |
  Rodokmen is a private shared family tree for one extended family, shown on a map of the Czech lands (19th century and earlier).
  Use the terms in GLOSSARY.md exactly (Member, Editor, Agent, Proposal, Draft, Tree, Source, Citation, Place, Municipality, Czech lands).
  Recorded decisions live in docs/adr/; artifacts must not contradict them without saying so.
  This repo (rodokmen-app) is public: never put family data, real people's names or real research notes in it; examples use invented people.
  The map app is mobile-first and must work on Android Chrome; its UI ships in Czech and English.
  The Tree backend is built from scratch (ADR 0004): TypeScript on Node, one PostgreSQL + PostGIS database (ADR 0005), current state plus a log of accepted Proposals (ADR 0006).
  One public monorepo with app/, server/ and shared/; the PWA is the only interface; app and API share one domain on an EU VPS (ADR 0007).
  rodokmen-data is a nightly one-way Export, never edited by hand (ADR 0008).

rules:
  proposal:
    - State what is out of scope.
  tasks:
    - Every task names how it is verified.
